name: Auto Cascade Merge

on:
  push:
    branches-ignore:
      - main

jobs:
  cascade:
    runs-on: ubuntu-latest
    permissions:
      contents: write 
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create Local Tracking Branches
        run: |
          # The Python script iterates over local branches (repo.heads).
          # In CI, we must convert remote branches to local tracking branches first!
          for remote in $(git branch -r | grep -v '\->' | grep origin/); do
            git branch --track "${remote#origin/}" "$remote" || true
          done

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        
      - name: Set up Python
        run: uv python install 3.12

      - name: Configure Git Bot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run Cascade Merge
        run: uv run cc-cli cascade

      - name: Upload Merge Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cascade-merge-report
          path: cascade_log_*.json
