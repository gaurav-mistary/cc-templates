version: '3.8'

services:
  traefik:
    image: traefik:v3.1
    container_name: traefik
    command:
      - "--api.insecure=false"
      - "--api.dashboard=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.web.http.redirections.entryPoint.scheme=https"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.myresolver.acme.tlschallenge=true"
      - "--certificatesresolvers.myresolver.acme.email={{cookiecutter.acme_email}}"
      - "--certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "traefik-certificates:/letsencrypt"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard.rule=Host(`traefik.{{cookiecutter.domain_name}}`)"
      - "traefik.http.routers.dashboard.service=api@internal"
      - "traefik.http.routers.dashboard.middlewares=auth"
      - "traefik.http.routers.dashboard.entrypoints=websecure"
      - "traefik.http.routers.dashboard.tls.certresolver=myresolver"
      - "traefik.http.middlewares.auth.basicauth.users={{cookiecutter.dashboard_user}}:__DASHBOARD_PASSWORD_HASH__"
    networks:
{%- for net in cookiecutter.traefik_networks.split(',') %}
      - {{ net.strip() }}
{%- endfor %}

  web:
    image: nginx:alpine
    container_name: basic_webserver
    volumes:
      - "./html:/usr/share/nginx/html:ro"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.web.rule=Host(`{{cookiecutter.subdomain}}.{{cookiecutter.domain_name}}`)"
      - "traefik.http.routers.web.entrypoints=websecure"
      - "traefik.http.routers.web.tls.certresolver=myresolver"
    networks:
      - {{ cookiecutter.traefik_networks.split(',')[0].strip() }}

  dockhand:
    image: fnsys/dockhand:{{ cookiecutter.dockhand_version }}
    container_name: dockhand
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - dockhand_data:/app/data
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dockhand.rule=Host(`dockhand.{{cookiecutter.domain_name}}`)"
      - "traefik.http.routers.dockhand.entrypoints=websecure"
      - "traefik.http.routers.dockhand.tls.certresolver=myresolver"
      - "traefik.http.services.dockhand.loadbalancer.server.port=3000"
    networks:
      - {{ cookiecutter.dockhand_network }}

volumes:
  traefik-certificates:
  dockhand_data:

networks:
{%- for net in cookiecutter.traefik_networks.split(',') %}
  {{ net.strip() }}:
    name: {{ net.strip() }}_network
{%- endfor %}
  {{ cookiecutter.dockhand_network }}:
    driver: bridge
