version: '3.8'

services:
  traefik:
    image: traefik:v3.1
    container_name: traefik
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
      - "8080:8080" # Dashboard, insecure for now
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    networks:
{%- for net in cookiecutter.traefik_networks.split(',') %}
      - {{ net.strip() }}
{%- endfor %}

  web:
    image: nginx:alpine
    container_name: basic_webserver
    volumes:
      - "./html:/usr/share/nginx/html:ro"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.web.rule=Host(`{{cookiecutter.subdomain}}.{{cookiecutter.domain_name}}`)"
      - "traefik.http.routers.web.entrypoints=web"
    networks:
      - {{ cookiecutter.traefik_networks.split(',')[0].strip() }}

  dockhand:
    image: fnsys/dockhand:{{ cookiecutter.dockhand_version }}
    container_name: dockhand
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - dockhand_data:/app/data
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dockhand.rule=Host(`dockhand.{{cookiecutter.domain_name}}`)"
      - "traefik.http.routers.dockhand.entrypoints=web"
      - "traefik.http.services.dockhand.loadbalancer.server.port=3000"
    networks:
      - {{ cookiecutter.dockhand_network }}

volumes:
  dockhand_data:

networks:
{%- for net in cookiecutter.traefik_networks.split(',') %}
  {{ net.strip() }}:
    name: {{ net.strip() }}_network
{%- endfor %}
  {{ cookiecutter.dockhand_network }}:
    driver: bridge
